# Configuracao do Alembic.
#
# Nao existe `sqlalchemy.url` aqui de proposito: a URL vem de app.config, que le
# a variavel de ambiente DATABASE_URL. Duplicar a URL neste arquivo criaria a
# chance de a migracao rodar num banco e a aplicacao noutro - e ainda colocaria
# a senha do Postgres dentro do repositorio.

[alembic]
script_location = alembic
prepend_sys_path = .

# Nome do arquivo de migracao com data na frente, para a pasta ficar em ordem
# cronologica em vez de ordem aleatoria de hash.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Windows: separador de caminho do sistema, senao o caminho das versoes quebra.
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
