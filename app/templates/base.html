<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Prospecção{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="shell">
    {% if usuario %}
    <header class="topbar">
      <a class="brand" href="/app">Prospecção <span>WhatsApp</span></a>
      <nav class="nav">
        <a href="/app" class="{{ 'active' if request.url.path == '/app' else '' }}">Início</a>
        <a href="/conexao" class="{{ 'active' if request.url.path.startswith('/conexao') else '' }}">Conexão</a>
        <a href="/app#campanhas" class="{{ 'active' if request.url.path.startswith('/campanhas') else '' }}">Campanhas</a>
        <a href="/conversas" class="{{ 'active' if request.url.path.startswith('/conversas') else '' }}">Conversas</a>
        <a href="/optouts" class="{{ 'active' if request.url.path.startswith('/optouts') else '' }}">Opt-outs</a>
        <form class="inline" method="post" action="/logout">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button class="btn" type="submit" style="padding:6px 10px;font-size:0.85rem">Sair</button>
        </form>
      </nav>
    </header>
    {% endif %}

    {% if flash %}
    <div class="flash {{ flash.tipo }}" role="status">{{ flash.texto }}</div>
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
